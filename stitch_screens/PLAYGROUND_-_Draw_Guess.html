": ["20px", { "lineHeight": "26px", "letterSpacing": "0em", "fontWeight": "500" }], "display-xl-mobile": ["44px", { "lineHeight": "48px", "letterSpacing": "-0.03em", "fontWeight": "700" }], "body-lg": ["18px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "400" }] } } } };</script></head><body class="bg-surface text-on-surface font-body-md text-body-md flex flex-col min-h-screen selection:bg-primary-container selection:text-on-primary-container"><header class="fixed top-0 inset-x-0 z-50 bg-surface/85 backdrop-blur-xl pt-safe shadow-[0_1px_12px_rgba(0,0,0,0.4)]"><div class="h-16 px-gutter-mobile flex items-center justify-between gap-space-xs"><div class="flex items-center gap-space-sm"><img alt="PLAYGROUND Brand Logo" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1Vo_feeDoeHsVAsaEVJ4cAajymWwLkC9NOBsYUR7ILjp2dX8XF3vOJICbA4unUrR2MTFIJQiA_gbZN_5Mx3xmLB30f1ZZtT_Uy6z5xOlEsqKvrpHQ0GfY8vrfbaAYxop_-tbIX573u3PfwmnOLpb7W-I7jzUimn4cDmOcKj0VPk7in6hSVAQsOxOMnGt6a1PCNTwkB13UI0Ypj4z0tpo2T2qzAHrTLow1hgZkTOZio0nm0YU5DU7Wz86R1P"><div class="flex flex-col"><span class="font-headline-sm text-headline-sm uppercase tracking-wider text-primary leading-none">PLAYGROUND</span><span class="font-label-sm text-label-sm text-on-surface-variant tracking-widest">Draw &amp; Guess</span></div></div><div class="flex items-center gap-space-xs"><div class="flex items-center gap-1.5 px-2 py-1 bg-surface-container-high rounded-full shadow-[0_0_8px_rgba(203,242,49,0.2)]"><span class="w-2 h-2 rounded-full bg-primary-container animate-pulse"></span><span class="font-label-sm text-label-sm text-primary-fixed">LVL 42</span><span class="font-label-sm text-label-sm text-on-surface-variant font-bold">• 9.4k XP</span></div><button aria-label="Toggle Sound FX" class="w-11 h-11 flex items-center justify-center text-on-surface hover:text-primary-container transition-colors"><span class="material-symbols-outlined text-[20px]">volume_up</span></button><div class="relative flex items-center justify-center"><img alt="Profile" class="w-8 h-8 rounded-full object-cover ring-2 ring-primary-container/40" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCommleS70sr-p9hCsYoADMFGyjZY_91jCTJUEUv6oPGkM5JGnZhL-s6PmYlgluaKT1hHjzKxDHbgrQYTV6cTdBOQ3MM-Tmc6qD6WrD8NZ0D33VEjFpfeLFjiuJQnaONR4TfHrrBgYI6Cjau2VISDO1HRJWQp6BR7c3vHz9Pe9LLjPSqDZJnOKzstTxoiDdIJKC4YFgYZKtd5gPpKaLHK8NKzK4X-0KNy-FeUo26eCjuuPMLrRo0MC1FQ"><span class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-primary-container rounded-full ring-2 ring-surface"></span></div></div></div></header><main class="flex flex-col relative w-full pt-16 pb-24 bg-surface min-h-screen"><div class="flex flex-col w-full px-gutter-mobile gap-space-md select-none"><!-- Minimalist Game Header: Word Clue & Countdown Timer -->
<div class="flex items-center justify-between px-1 py-0.5">

<!-- Protagonist Drawing Canvas Container -->

  <span class="hidden" id="stroke-counter">0</span>

<!-- Compact Unified Single-Row Drawing Toolbar -->
<div class="flex items-center justify-between bg-surface-container-low rounded-xl px-3 py-2 border border-outline-variant/20 shadow-md gap-2">
  <!-- 4 Color Swatches -->
  <div class="flex items-center gap-2">

    <button aria-label="Color Violeta" class="color-btn w-7 h-7 rounded-full bg-secondary-fixed-dim hover:scale-105 transition-all shrink-0" data-color="#cbbeff"></button>

  <!-- Divider -->

  <!-- Divider -->

  </div>

<!-- Streamlined Compact Guess & Live Activity Section -->
<div class="flex flex-col bg-surface-container-low rounded-xl p-2.5 gap-2 border border-outline-variant/20 shadow-lg">
  <!-- Minimalist Feed (Last attempts, concise 1-2 lines) -->
  <div class="flex flex-col gap-1 overflow-hidden" id="guess-stream">
    <div class="flex items-center justify-between px-2.5 py-1 rounded bg-surface-container-high text-body-sm font-body-sm">
      <div class="flex items-center gap-1.5 truncate">
        <span class="text-outline font-label-sm text-label-sm">@Alex:</span>
        <span class="text-on-surface truncate">"Misil espacial"</span>
      </div>
      <span class="font-label-sm text-label-sm text-on-surface-variant font-medium shrink-0">❌ Frío</span>
    </div>
    <div class="flex items-center justify-between px-2.5 py-1 rounded bg-primary-container/15 text-body-sm font-body-sm">
      <div class="flex items-center gap-1.5 truncate">
        <span class="text-primary-container font-label-sm text-label-sm font-bold">@Tú:</span>
        <span class="text-primary font-bold truncate">"Cohete"</span>
      </div>
      <span class="font-label-sm text-label-sm text-primary-container font-bold shrink-0">✅ Correcto</span>
    </div>
  </div>

  <!-- Clean Guess Input Row -->
  <form class="flex items-center gap-2" id="guess-form">
    <input autocomplete="off" class="flex-1 bg-surface-container-lowest text-on-surface placeholder:text-on-surface-variant/60 px-3 py-2 rounded-lg font-body-sm text-body-sm outline-none border border-outline-variant/30 focus:border-primary-container focus:shadow-[0_0_12px_rgba(203,242,49,0.2)] transition-all" id="guess-input" placeholder="Escribe tu respuesta..." type="text">
    <button class="px-3.5 py-2 rounded-lg bg-tertiary-fixed-dim hover:bg-tertiary-fixed text-on-tertiary font-label-sm text-label-sm uppercase font-bold tracking-wider flex items-center justify-center gap-1 active:scale-95 transition-all shadow shrink-0" type="submit">
      <span class="material-symbols-outlined text-[16px]">send</span>
      <span class="">Adivinar</span>
    </button>
  </form>
</div></div>
<script>
  (() => {
    // Canvas & Context Setup
    const canvas = document.getElementById('paint-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const strokeCounter = document.getElementById('stroke-counter');
    const timerElem = document.getElementById('hud-timer');
    const timerProgress = document.getElementById('timer-progress');
    const guessForm = document.getElementById('guess-form');
    const guessInput = document.getElementById('guess-input');
    const guessStream = document.getElementById('guess-stream');

    let isDrawing = false;
    let currentColor = '#cbf231';
    let currentSize = 6;
    let isEraser = false;
    let strokeCount = 18;
    let strokesHistory = [];

    // Scale canvas to physical CSS pixel ratio
    const resizeCanvas = () => {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      renderInitialArt();
    };

    // Draw stylized pre-loaded neon rocket doodle
    const renderInitialArt = () => {
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Rocket body
      ctx.strokeStyle = '#cbf231';
      ctx.lineWidth = 5;
      ctx.shadowColor = 'rgba(203, 242, 49, 0.45)';
      ctx.shadowBlur = 12;

      ctx.beginPath();
      ctx.moveTo(160, 60);
      ctx.bezierCurveTo(200, 110, 205, 175, 195, 215);
      ctx.lineTo(125, 215);
      ctx.bezierCurveTo(115, 175, 120, 110, 160, 60);
      ctx.stroke();

      // Rocket Port Glass
      ctx.strokeStyle = '#cbbeff';
      ctx.shadowColor = 'rgba(203, 190, 255, 0.6)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(160, 130, 18, 0, Math.PI * 2);
      ctx.stroke();

      // Rocket Fins
      ctx.strokeStyle = '#ffb5a0';
      ctx.shadowColor = 'rgba(255, 181, 160, 0.5)';
      ctx.beginPath();
      ctx.moveTo(125, 195);
      ctx.lineTo(95, 235);
      ctx.lineTo(126, 225);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(195, 195);
      ctx.lineTo(225, 235);
      ctx.lineTo(194, 225);
      ctx.stroke();

      // Flame Trails
      ctx.strokeStyle = '#cbf231';
      ctx.shadowColor = 'rgba(203, 242, 49, 0.8)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(140, 225);
      ctx.lineTo(160, 265);
      ctx.lineTo(180, 225);
      ctx.stroke();

      ctx.restore();
      saveState();
    };

    const saveState = () => {
      try {
        strokesHistory.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
        if (strokesHistory.length > 20) strokesHistory.shift();
      } catch (e) {
        // Fallback for CORS or canvas memory limits
      }
    };

    const getPos = (e) => {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
      const clientY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    };

    const startDraw = (e) => {
      isDrawing = true;
      const { x, y } = getPos(e);
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = currentSize;
      if (isEraser) {
        ctx.strokeStyle = '#171717';
        ctx.shadowBlur = 0;
      } else {
        ctx.strokeStyle = currentColor;
        ctx.shadowColor = currentColor;
        ctx.shadowBlur = 8;
      }
    };

    const moveDraw = (e) => {
      if (!isDrawing) return;
      const { x, y } = getPos(e);
      ctx.lineTo(x, y);
      ctx.stroke();
    };

    const stopDraw = () => {
      if (!isDrawing) return;
      isDrawing = false;
      ctx.closePath();
      strokeCount++;
      if (strokeCounter) strokeCounter.textContent = strokeCount;
      saveState();
    };

    // Pointer Event Listeners for unified stylus/mouse/touch
    canvas.addEventListener('pointerdown', (e) => {
      canvas.setPointerCapture(e.pointerId);
      startDraw(e);
    });
    canvas.addEventListener('pointermove', moveDraw);
    canvas.addEventListener('pointerup', (e) => {
      canvas.releasePointerCapture(e.pointerId);
      stopDraw();
    });
    canvas.addEventListener('pointercancel', stopDraw);

    // Color Swatch Selection
    document.querySelectorAll('.color-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        isEraser = false;
        currentColor = btn.getAttribute('data-color');
        document.querySelectorAll('.color-btn').forEach((b) => {
          b.classList.remove('ring-2', 'ring-primary', 'scale-110');
        });
        const eraser = document.getElementById('eraser-btn');
        if (eraser) eraser.classList.remove('bg-primary-container', 'text-on-primary-container');
        btn.classList.add('ring-2', 'ring-primary', 'scale-110');
      });
    });

    // Eraser Toggle
    const eraserBtn = document.getElementById('eraser-btn');
    if (eraserBtn) {
      eraserBtn.addEventListener('click', () => {
        isEraser = true;
        document.querySelectorAll('.color-btn').forEach((b) => {
          b.classList.remove('ring-2', 'ring-primary', 'scale-110');
        });
        eraserBtn.classList.add('bg-primary-container', 'text-on-primary-container');
      });
    }

    // Brush Sizing
    document.querySelectorAll('.size-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        currentSize = parseInt(btn.getAttribute('data-size'), 10);
        document.querySelectorAll('.size-btn').forEach((b) => {
          b.className = 'size-btn px-2.5 py-1 rounded bg-surface-container-high text-on-surface-variant font-label-sm text-label-sm transition-all hover:text-on-surface flex items-center gap-1';
        });
        btn.className = 'size-btn px-2.5 py-1 rounded bg-primary-container text-on-primary-container font-label-sm text-label-sm font-bold transition-all shadow-sm flex items-center gap-1';
      });
    });

    // Undo action
    const undoBtn = document.getElementById('undo-btn');
    if (undoBtn) {
      undoBtn.addEventListener('click', () => {
        if (strokesHistory.length > 1) {
          strokesHistory.pop(); // Current frame
          const previousState = strokesHistory[strokesHistory.length - 1];
          ctx.putImageData(previousState, 0, 0);
          if (strokeCount > 0) strokeCount--;
          if (strokeCounter) strokeCounter.textContent = strokeCount;
        }
      });
    }

    // Clear Canvas
    const clearBtn = document.getElementById('clear-btn');
    if (clearBtn) {
      clearBtn.addEventListener('click', () => {
        const dpr = window.devicePixelRatio || 1;
        ctx.fillStyle = '#171717';
        ctx.fillRect(0, 0, canvas.width / dpr, canvas.height / dpr);
        saveState();
        strokeCount = 0;
        if (strokeCounter) strokeCounter.textContent = '0';
      });
    }

    // Interactive Guess Feed
    if (guessForm && guessInput && guessStream) {
      guessForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const val = guessInput.value.trim();
        if (!val) return;

        const guessItem = document.createElement('div');
        const isMatch = val.toLowerCase().includes('cohete');

        if (isMatch) {
          guessItem.className = 'flex items-center justify-between px-2.5 py-1.5 rounded-lg bg-primary-container/20 shadow-md animate-bounce';
          guessItem.innerHTML = `
            <div class="flex items-center gap-2 min-w-0">
              <span class="font-label-sm text-label-sm text-primary-container font-bold">@Tú:</span>
              <span class="font-body-sm text-body-sm text-primary font-bold truncate">"${val}"</span>
            </div>
            <span class="font-label-sm text-label-sm text-primary-container shrink-0 font-bold">✅ ¡ACERTASTE! +200 pts</span>
          `;
        } else {
          guessItem.className = 'flex items-center justify-between px-2.5 py-1.5 rounded-lg bg-surface-container-high transition-all';
          guessItem.innerHTML = `
            <div class="flex items-center gap-2 min-w-0">
              <span class="font-label-sm text-label-sm text-on-surface-variant font-medium">@Tú:</span>
              <span class="font-body-sm text-body-sm text-on-surface truncate">"${val}"</span>
            </div>
            <span class="font-label-sm text-label-sm text-error shrink-0 font-bold">❌ Prueba otra</span>
          `;
        }

        guessStream.appendChild(guessItem);
        guessStream.scrollTop = guessStream.scrollHeight;
        guessInput.value = '';
      });
    }

    // Countdown Timer Simulation
    let remaining = 42;
    const interval = setInterval(() => {
      remaining--;
      if (remaining <= 0) {
        remaining = 60;
      }
      const secs = remaining < 10 ? `0${remaining}` : remaining;
      if (timerElem) timerElem.textContent = `00:${secs}`;
      if (timerProgress) {
        const pct = (remaining / 60) * 100;
        timerProgress.style.width = `${pct}%`;
      }
    }, 1000);

    // Mode Selector Switcher Logic
    ['mode-challenge', 'mode-free', 'mode-pass'].forEach((id) => {
      const btn = document.getElementById(id);
      if (!btn) return;
      btn.addEventListener('click', () => {
        ['mode-challenge', 'mode-free', 'mode-pass'].forEach((otherId) => {
          const other = document.getElementById(otherId);
          if (other) {
