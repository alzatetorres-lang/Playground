<!-- HUD SUPERIOR: ESTADO DE PARTIDA -->
<section class="flex flex-col gap-space-xs pt-space-xs">
  <div class="flex items-center justify-between">

      <span class="font-headline-sm text-headline-sm text-primary font-bold tracking-tight" id="question-tracker">04</span>
      <span class="font-label-md text-label-md text-on-surface-variant font-medium">/ 10</span>
    </div>
    <div class="flex items-center gap-space-md">
      <div class="flex items-center gap-1.5 bg-surface-container-high px-2.5 py-1 rounded-full">
        <span class="material-symbols-outlined text-primary-container text-[16px]" id="timer-icon">timer</span>
        <span class="font-label-md text-label-md text-primary font-bold" id="timer-display">16</span>
        <span class="font-label-sm text-label-sm text-on-surface-variant">s</span>
      </div>
      <div class="flex items-center gap-1 text-on-surface-variant font-label-md text-label-md font-semibold">
        <span class="material-symbols-outlined text-primary-fixed text-[16px]">stars</span>
        <span id="current-score" class="text-primary-fixed font-bold tracking-wide">1,480</span>
      </div>

  <div class="w-full bg-surface-container-highest h-1 rounded-full overflow-hidden mt-1">
    <div class="h-full bg-primary-container rounded-full transition-all duration-300" id="progress-bar-fill" style="width: 40%;"></div>
  </div>
</section>
<!-- TARJETA EDITORIAL DE PREGUNTA -->
<article class="py-space-md flex flex-col gap-space-sm">
  <h2 class="font-headline-md text-headline-md text-on-surface font-semibold tracking-tight text-left leading-snug">
    ¿Qué algoritmo es comúnmente utilizado para encontrar el camino más corto en grafos y navegación de videojuegos?
  </h2>
</article>
<!-- OPCIONES DE RESPUESTA EN REJILLA TÁCTIL -->
<section class="flex flex-col gap-space-sm" id="answers-container">
  <button class="answer-btn text-left w-full p-space-md rounded-xl bg-surface-container-high border-2 border-primary-container text-on-surface flex items-center justify-between transition-all active:scale-[0.98]" data-option="A" type="button">
    <div class="flex items-center gap-space-sm min-w-0">
      <span class="w-9 h-9 rounded-lg bg-primary-container text-on-primary-fixed flex items-center justify-center font-headline-sm text-headline-sm font-bold flex-shrink-0">
        A
      </span>
      <span class="font-body-lg text-body-lg font-semibold text-primary truncate">Algoritmo A* (A-Star)</span>
    </div>
    <span class="material-symbols-outlined text-primary-container text-[24px] flex-shrink-0" style="font-variation-settings: 'FILL' 1;">check_circle</span>
  </button>
  <button class="answer-btn text-left w-full p-space-md rounded-xl bg-surface-container-low text-on-surface flex items-center justify-between hover:bg-surface-container-high transition-all active:scale-[0.98]" data-option="B" type="button">
    <div class="flex items-center gap-space-sm min-w-0">
      <span class="w-9 h-9 rounded-lg bg-surface-container-highest text-on-surface-variant flex items-center justify-center font-headline-sm text-headline-sm font-bold flex-shrink-0">
        B
      </span>
      <span class="font-body-lg text-body-lg text-on-surface truncate">Bubble Sort</span>
    </div>
    <span class="material-symbols-outlined text-on-surface-variant text-[22px] opacity-20">radio_button_unchecked</span>
  </button>
  <button class="answer-btn text-left w-full p-space-md rounded-xl bg-surface-container-low text-on-surface flex items-center justify-between hover:bg-surface-container-high transition-all active:scale-[0.98]" data-option="C" type="button">
    <div class="flex items-center gap-space-sm min-w-0">
      <span class="w-9 h-9 rounded-lg bg-surface-container-highest text-on-surface-variant flex items-center justify-center font-headline-sm text-headline-sm font-bold flex-shrink-0">
        C
      </span>
      <span class="font-body-lg text-body-lg text-on-surface truncate">Binary Search</span>
    </div>
    <span class="material-symbols-outlined text-on-surface-variant text-[22px] opacity-20">radio_button_unchecked</span>
  </button>
  <button class="answer-btn text-left w-full p-space-md rounded-xl bg-surface-container-low text-on-surface flex items-center justify-between hover:bg-surface-container-high transition-all active:scale-[0.98]" data-option="D" type="button">
    <div class="flex items-center gap-space-sm min-w-0">
      <span class="w-9 h-9 rounded-lg bg-surface-container-highest text-on-surface-variant flex items-center justify-center font-headline-sm text-headline-sm font-bold flex-shrink-0">
        D
      </span>
      <span class="font-body-lg text-body-lg text-on-surface truncate">K-Means Clustering</span>

<!-- CONTROLES TÁCTILES PRINCIPALES -->
<section class="flex flex-col gap-space-xs mt-1">
<button class="w-full h-14 bg-primary-container text-on-primary-fixed rounded-xl flex items-center justify-center gap-2 shadow-[0_0_24px_rgba(203,242,49,0.4)] active:scale-[0.97] transition-all" id="btn-next-question">
<span class="font-label-lg text-label-lg font-bold tracking-wider uppercase">SIGUIENTE PREGUNTA</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>

</section>
<!-- PANEL DE RÉCORD Y RETENCIÓN EXPANDIBLE -->

</div>
<script>
  // Control Interactivo de la Sesión del Quiz
  (() => {
    let timeLeft = 16;
    let currentScore = 1480;
    let isPaused = false;
    let timerId = null;

    const timerDisplay = document.getElementById('timer-display');
    const timerIcon = document.getElementById('timer-icon');
    const scoreDisplay = document.getElementById('current-score');
    const feedbackBurst = document.getElementById('feedback-burst');
    const btnNext = document.getElementById('btn-next-question');
    const btnPause = document.getElementById('btn-pause');
    const btnRestart = document.getElementById('btn-restart');
    const toggleStats = document.getElementById('toggle-stats-panel');
    const statsContent = document.getElementById('stats-content');
    const statsChevron = document.getElementById('stats-chevron');
    const optionBtns = document.querySelectorAll('.answer-btn');

    // Manejo de Cuenta Atrás
    const startTimer = () => {
      clearInterval(timerId);
      timerId = setInterval(() => {
        if (!isPaused && timeLeft > 0) {
          timeLeft--;
          timerDisplay.textContent = timeLeft < 10 ? '0' + timeLeft : timeLeft;

          // Animación y advertencia cuando quedan menos de 5 segundos
          if (timeLeft <= 5) {
            timerDisplay.classList.add('text-error');
            timerIcon.classList.add('text-error', 'animate-pulse');
          } else {
            timerDisplay.classList.remove('text-error');
            timerIcon.classList.remove('text-error', 'animate-pulse');
          }

          if (timeLeft === 0) {
            clearInterval(timerId);
          }
        }
      }, 1000);
    };

    startTimer();

    // Toggle de Panel de Récords
    toggleStats.addEventListener('click', () => {
      const isHidden = statsContent.classList.toggle('hidden');
      statsChevron.style.transform = isHidden ? 'rotate(0deg)' : 'rotate(180deg)';
    });

    // Control de Pausa
    btnPause.addEventListener('click', () => {
      isPaused = !isPaused;
      const pauseLabel = btnPause.querySelector('span:last-child');
      const pauseIcon = btnPause.querySelector('span:first-child');
      if (isPaused) {
        pauseLabel.textContent = 'Reanudar';
        pauseIcon.textContent = 'play_arrow';
        btnPause.classList.add('text-primary-container');
      } else {
        pauseLabel.textContent = 'Pausar';
        pauseIcon.textContent = 'pause';
        btnPause.classList.remove('text-primary-container');
      }
    });

    // Reiniciar Estado
    btnRestart.addEventListener('click', () => {
      timeLeft = 20;
      timerDisplay.textContent = '20';
      timerDisplay.classList.remove('text-error');
      timerIcon.classList.remove('text-error', 'animate-pulse');
      isPaused = false;
      const pauseLabel = btnPause.querySelector('span:last-child');
      const pauseIcon = btnPause.querySelector('span:first-child');
      pauseLabel.textContent = 'Pausar';
      pauseIcon.textContent = 'pause';
      startTimer();
    });

    // Selección interactiva de opciones
    optionBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        optionBtns.forEach(b => {
          b.classList.remove('bg-surface-bright', 'shadow-[0_0_16px_rgba(203,242,49,0.25)]');
          b.classList.add('bg-surface-container-low');
          const badge = b.querySelector('span:first-child');
          const icon = b.querySelector('.material-symbols-outlined');
          badge.classList.remove('bg-primary-container', 'text-on-primary-fixed');
          badge.classList.add('bg-surface-container-highest', 'text-on-surface-variant');
          icon.textContent = 'radio_button_unchecked';
          icon.classList.add('opacity-20');
        });

        // Activar seleccionada
        btn.classList.add('bg-surface-bright', 'shadow-[0_0_16px_rgba(203,242,49,0.25)]');
        btn.classList.remove('bg-surface-container-low');
        const activeBadge = btn.querySelector('span:first-child');
        const activeIcon = btn.querySelector('.material-symbols-outlined');
        activeBadge.classList.add('bg-primary-container', 'text-on-primary-fixed');
        activeBadge.classList.remove('bg-surface-container-highest', 'text-on-surface-variant');
        activeIcon.textContent = 'check_circle';
        activeIcon.classList.remove('opacity-20');
        activeIcon.classList.add('text-primary-container');

        // Disparo táctil en el feedback
        feedbackBurst.classList.add('scale-105');
        setTimeout(() => feedbackBurst.classList.remove('scale-105'), 200);
      });
    });

    // Botón Siguiente Pregunta
    btnNext.addEventListener('click', () => {
      currentScore += 140;
      scoreDisplay.textContent = currentScore.toLocaleString() + ' PTS';
      timeLeft = 20;
      timerDisplay.textContent = '20';
      startTimer();
    });
  })();
</script></main><nav class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_-2px_16px_rgba(0,0,0,0.5)]" data-active-classes="text-primary-container"><div class="flex justify-around items-center h-16 px-space-xs"><a class="flex flex-col items-center justify-center min-w-[56px] h-12 text-on-surface-variant hover:text-on-surface transition-all" data-path="inicio" href="#"><span class="material-symbols-outlined text-[22px]">sports_esports</span><span class="font-label-sm text-label-sm uppercase tracking-wider mt-0.5">Inicio</span></a><a aria-current="page" class="flex flex-col items-center justify-center min-w-[56px] h-12 transition-all text-primary-container" data-path="quiz-arena" href="#"><span class="material-symbols-outlined text-[22px]">bolt</span><span class="font-label-sm text-label-sm uppercase tracking-wider mt-0.5">Quiz</span></a><a class="flex flex-col items-center justify-center min-w-[56px] h-12 text-on-surface-variant hover:text-on-surface transition-all" data-path="draw-and-guess" href="#"><span class="material-symbols-outlined text-[22px]">draw</span><span class="font-label-sm text-label-sm uppercase tracking-wider mt-0.5">Draw</span></a><a class="flex flex-col items-center justify-center min-w-[56px] h-12 text-on-surface-variant hover:text-on-surface transition-all" data-path="player-stats" href="#"><span class="material-symbols-outlined text-[22px]">leaderboard</span><span class="font-label-sm text-label-sm uppercase tracking-wider mt-0.5">Stats</span></a></div></nav>
