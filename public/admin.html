<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel · Playground</title>
<style>
  :root { --bg:#06070d; --panel:#0e1120; --panel-2:#151a31; --line:#243155; --ink:#e8ecff; --muted:#9aa6cf; --lime:#c8ff2e; --cyan:#27f3ff; --magenta:#ff2e93; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, sans-serif; padding:24px 16px 48px; }
  main { max-width:1100px; margin:0 auto; }
  h1 { font-size:1.5rem; margin:0 0 4px; } h2 { font-size:1rem; color:var(--cyan); margin:0 0 12px; text-transform:uppercase; letter-spacing:.06em; }
  .sub { color:var(--muted); margin:0 0 24px; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); margin-bottom:24px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 16px; }
  .kpi b { display:block; font-size:1.8rem; color:var(--lime); font-variant-numeric:tabular-nums; } .kpi span { color:var(--muted); font-size:.85rem; }
  .cols { display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(320px,1fr)); margin-bottom:12px; }
  table { width:100%; border-collapse:collapse; font-size:.92rem; } th, td { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); } th { color:var(--muted); font-weight:500; } td.n { text-align:right; font-variant-numeric:tabular-nums; }
  svg { width:100%; height:120px; display:block; } .empty { color:var(--muted); }
  form { max-width:360px; margin:20vh auto 0; display:grid; gap:12px; } input, button { font:inherit; padding:10px 12px; border-radius:6px; border:1px solid var(--line); background:var(--panel-2); color:var(--ink); }
  button { background:var(--lime); color:#101800; font-weight:700; border:0; cursor:pointer; } .err { color:var(--magenta); min-height:1.4em; }
  a { color:var(--cyan); }
</style>
</head>
<body>
<main id="app">
  <form id="login">
    <h1>Panel · Playground</h1>
    <input id="token" type="password" placeholder="Token de administrador" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</main>
<script src="/js/admin.js"></script>
</body>
</html>
